name: Verify backend and MySQL migrations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dmysql.it=true verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s simulator -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/site/jacoco
