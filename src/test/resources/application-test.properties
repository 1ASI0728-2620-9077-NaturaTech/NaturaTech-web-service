# Configuración para Tests de Integración
spring.application.name=PlantSync-Test
# Usar H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;INIT=SET REFERENTIAL_INTEGRITY FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Hibernate y Flyway
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# Weather API
weather.api.key=dummy-key
# Logging
logging.level.org.springframework.web=INFO
logging.level.com.plantsync.platform=DEBUG

authorization.jwt.secret=test-only-secret-for-jwt-signatures-not-for-production-123456
edge.api.key=test-only-edge-key
integrations.workers.enabled=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.com.plantsync.platform=INFO
