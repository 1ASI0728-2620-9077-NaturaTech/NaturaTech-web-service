# Spring Application Name
spring.application.name=PlantSync Backend
# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.plantsync.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7
weather.api.key=${WEATHER_API_KEY:}
edge.api.key=${EDGE_API_KEY:}
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@
# Flyway Configuration
spring.flyway.enabled=false

app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
integrations.gemini.key=${GEMINI_API_KEY:}
integrations.gemini.model=${GEMINI_MODEL:}
integrations.iot.approved-nodes=${IOT_APPROVED_NODES:}
integrations.iot.environment=${IOT_ENVIRONMENT:SIMULATED}
integrations.iot.node-key-hashes=${IOT_NODE_KEY_HASHES:{}}
integrations.wallet.domain=${WALLET_DOMAIN:localhost:5173}
integrations.rewards.enabled=${REWARDS_ENABLED:false}
integrations.rewards.rules=${REWARD_RULES:{}}
integrations.sepolia.rpc=${SEPOLIA_RPC_URL:}
integrations.sepolia.contract=${SEPOLIA_CONTRACT:}
integrations.sepolia.minter-key=${SEPOLIA_MINTER_KEY:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never

bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
