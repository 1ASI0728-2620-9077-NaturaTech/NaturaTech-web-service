spring.datasource.url=jdbc:h2:file:./.data/plantsync;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
server.address=127.0.0.1
# Local secrets only; excluded from Git and Docker. Environment variables take precedence.
spring.config.import=optional:file:.env.local[.properties]
