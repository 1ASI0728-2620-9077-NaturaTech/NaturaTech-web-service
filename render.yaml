services:
  - type: web
    name: plantsync-api
    runtime: docker
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: WALLET_DOMAIN
        sync: false
      - key: IOT_ENVIRONMENT
        value: SIMULATED
      - key: REWARDS_ENABLED
        value: "false"
